name: Build Android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Target Type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - appbundle
          - both
      build_mode:
        description: 'Build Mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_android:
    name: Build Android Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        run: |
          if [ "${{ inputs.build_mode }}" = "release" ]; then
            flutter build apk --release --split-per-abi --android-skip-build-dependency-validation
          else
            flutter build apk --debug --android-skip-build-dependency-validation
          fi

      - name: Build AppBundle (AAB)
        if: ${{ inputs.build_type == 'appbundle' || inputs.build_type == 'both' }}
        run: |
          if [ "${{ inputs.build_mode }}" = "release" ]; then
            flutter build appbundle --release --android-skip-build-dependency-validation
          else
            flutter build appbundle --debug --android-skip-build-dependency-validation
          fi

      - name: Upload APKs
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: voxy-android-apks-${{ inputs.build_mode }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Upload AppBundle
        if: ${{ inputs.build_type == 'appbundle' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: voxy-android-bundle-${{ inputs.build_mode }}
          path: build/app/outputs/bundle/**/*.aab
          retention-days: 14
